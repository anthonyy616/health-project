; Wearable prototype firmware (Phase I) - reference implementation.
; Two environments: sacrificial WROOM-32 prototype, final ESP32-S3.
; The Python host side (src/wearable/) is software-verified with the mock
; transport; flashing/checklist validation on physical boards remains an
; explicitly tracked outstanding requirement.

[env:wroom32]
platform = espressif32@^6.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Library@^1.8.0
    electroniccats/MPU6050@^1.4.3
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -DSIMULATE=${sysenv.SIMULATE:0}
    -DCORE_DEBUG_LEVEL=1

[env:esp32s3]
platform = espressif32@^6.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Library@^1.8.0
    electroniccats/MPU6050@^1.4.3
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -DSIMULATE=${sysenv.SIMULATE:0}
    -DCORE_DEBUG_LEVEL=1
